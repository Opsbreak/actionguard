version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date
  # (Dependabot updates both the SHA and the trailing version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
