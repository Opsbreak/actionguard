# Hardened counterpart of vulnerable-repo/.github/workflows/post-ci.yml:
# artifacts go to an isolated temp directory, are validated before use and are
# never executed; the token is read-only.
name: Post CI results

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate and summarize
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr_number="$(cat "$RUNNER_TEMP/coverage/pr_number.txt")"
          [[ "$pr_number" =~ ^[0-9]+$ ]] || { echo "invalid PR number" >&2; exit 1; }
          printf 'Coverage for PR #%s (branch %s)\n' "$pr_number" "$BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ${{ runner.temp }}/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
