# Hardened replacement for the build half of vulnerable-repo's pr-preview.yml:
# untrusted PR code is built in an unprivileged `pull_request` workflow with a
# read-only token and no secrets. Only build output is handed over as an artifact.
name: PR build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Record PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > dist/pr_number.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview
          path: dist/
          retention-days: 3
