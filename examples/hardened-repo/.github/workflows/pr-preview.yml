# Hardened replacement for the deploy half of vulnerable-repo's pr-preview.yml:
# the privileged workflow_run job never checks out or executes PR code, keeps
# the artifact in an isolated directory and validates everything it reads.
name: PR preview deploy

on:
  workflow_run:
    workflows: ["PR build"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      # Needed to comment on the PR. This job never runs PR code.
      pull-requests: write # actionguard: ignore[AG004]
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview
          path: ${{ runner.temp }}/preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate PR number
        id: pr
        run: |
          pr_number="$(cat "$RUNNER_TEMP/preview/pr_number.txt")"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "invalid PR number" >&2
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Deploy preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          npx --yes netlify-cli@17.38.1 deploy \
            --dir "$RUNNER_TEMP/preview" --alias "pr-$PR_NUMBER"

      - name: Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: "Preview deployed.",
            });
