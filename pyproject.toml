[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "actionguard"
description = "Static security analyzer for GitHub Actions workflows: script injection, pwn requests, artifact poisoning, unpinned actions and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Opsbreak Inc.", email = "admin@opsbreak.com" }]
keywords = ["github-actions", "security", "sast", "ci-cd", "supply-chain", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0.3"]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.10"]

[project.scripts]
actionguard = "actionguard.cli:main"

[project.urls]
Homepage = "https://github.com/Opsbreak/actionguard"
Issues = "https://github.com/Opsbreak/actionguard/issues"
Changelog = "https://github.com/Opsbreak/actionguard/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/actionguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/actionguard"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET", "TID"]
# Line length is enforced by `ruff format`; long string literals are allowed.
ignore = ["E501", "RET504", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
